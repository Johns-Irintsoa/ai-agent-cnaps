services:
  app:
    container_name: ai-agent-cnaps
    image: ai-agent-cnaps-app
    # build:
    #   context: .
    #   dockerfile: Dockerfile.base
    env_file:
      - .env
    command: python -m uvicorn src.api.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - chroma_data:/app/vector_cnaps_db
    extra_hosts:
      - "model-runner.docker.internal:host-gateway"
    environment:
      - UVICORN_LOOP=asyncio
    networks:
      - app-network
  redis-cache:
    # 1. Utiliser image stable et légère
    image: redis/redis-stack:latest
    container_name: redis_cnaps_server
    restart: unless-stopped

    # 2. Définir le réseau interne
    networks:
      - app-network

    # 3. Monter un volume nommé pour les données
    volumes:
      - redis_data:/data  # Volume nommé

    # 4. Exposer uniquement sur le réseau Docker interne
    #    (Pas de ports "6379:6379" ici)
    expose:
      - "6379"

    # 5. Configurer la commande de démarrage pour activer la persistance
    # command:
    #   - redis-server
    #   - --appendonly
    #   - yes
    #   - --requirepass
    #   - ${REDIS_PASSWORD}
    #   - --bind
    #   - 0.0.0.0

    environment:
      - REDIS_ARGS=--appendonly yes --protected-mode no --bind 0.0.0.0 --requirepass ${REDIS_PASSWORD}

    # 6. Ajouter un healthcheck
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    # 7. Définir des limites de ressources
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.50'
        reservations:
          memory: 256M
          cpus: '0.25'

networks:
  app-network:
    driver: bridge

volumes:
  chroma_data:
  redis_data:
    name: redis_cnaps_data

models:
  bge-m3:
    model: gpustack/bge-m3-gguf
    # Augmente la fenêtre pour accepter vos 525 tokens et plus
    context_size: 8192
