@if (chat.authRequired()) {
  <div class="auth-form">
    <p class="auth-label">Authentifiez-vous pour accéder à vos données</p>
    <div class="auth-fields">
      <input
        class="auth-input"
        type="text"
        placeholder="Matricule"
        [value]="matricule()"
        (input)="matricule.set($any($event.target).value)"
        [disabled]="chat.isLoading()"
        aria-label="Matricule"
      />
      <input
        class="auth-input"
        type="password"
        placeholder="Mot de passe"
        [value]="password()"
        (input)="password.set($any($event.target).value)"
        (keydown.enter)="submitAuth()"
        [disabled]="chat.isLoading()"
        aria-label="Mot de passe"
      />
    </div>
    <div class="auth-actions">
      <button
        class="auth-btn auth-btn--cancel"
        (click)="cancelAuth()"
        [disabled]="chat.isLoading()"
      >Annuler</button>
      <button
        class="auth-btn auth-btn--confirm"
        (click)="submitAuth()"
        [disabled]="!matricule().trim() || !password().trim() || chat.isLoading()"
      >Confirmer</button>
    </div>
  </div>
} @else {
  <div class="input-area">
    <textarea
      class="input-field"
      placeholder="Posez votre question..."
      rows="1"
      [value]="text()"
      (input)="text.set($any($event.target).value)"
      (keydown)="onKeydown($event)"
      [disabled]="chat.isLoading()"
      aria-label="Votre message"
    ></textarea>

    <button
      class="send-btn"
      (click)="send()"
      [disabled]="!text().trim() || chat.isLoading()"
      aria-label="Envoyer"
      title="Envoyer"
    >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
    </button>
  </div>
}
