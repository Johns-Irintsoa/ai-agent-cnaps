services:
  ollama:
    image: ollama/ollama:latest
    container_name: rag-cnaps-ollama
    volumes:
      - ai-agent-cnaps_ollama_data:/root/.ollama 
    ports:
      - "11434:11434"
    restart: unless-stopped
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.37.2
    container_name: rag-cnaps-weaviate
    command:
    - --host
    - 0.0.0.0
    - --port
    - '8080'
    - --scheme
    - http
    
    ports:
    - 8080:8080
    - 50051:50051
    volumes:
      - weaviate_data:/var/lib/weaviate
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'none'
      ENABLE_MODULES: 'text2vec-transformers,text2vec-ollama'  # optionnel
      CLUSTER_HOSTNAME: 'node1'
    restart: unless-stopped
    depends_on:
      - ollama

volumes:
  ai-agent-cnaps_ollama_data:
    external: true   # indique que ce volume a déjà été créé en dehors du compose
  weaviate_data:
