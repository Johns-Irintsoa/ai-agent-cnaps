services:
  app:
    container_name: ai-agent-cnaps
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - /vector_cnaps_db:/app/vector_cnaps_db
    extra_hosts:
      - "model-runner.docker.internal:host-gateway"

models:
  bge-m3:
    model: gpustack/bge-m3-gguf
    # Augmente la fenêtre pour accepter vos 525 tokens et plus
    context_size: 8192