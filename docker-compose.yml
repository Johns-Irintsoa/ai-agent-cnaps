services:
  app:
    container_name: ai-agent-cnaps
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command: uvicorn src.api.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - chroma_data:/app/vector_cnaps_db
    extra_hosts:
      - "model-runner.docker.internal:host-gateway"

volumes:
  chroma_data:

models:
  bge-m3:
    model: gpustack/bge-m3-gguf
    # Augmente la fenêtre pour accepter vos 525 tokens et plus
    context_size: 8192