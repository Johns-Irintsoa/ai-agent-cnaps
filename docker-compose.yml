services:
  backend:
    container_name: backend
    image: img-rag-cnaps:0.0.1
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command: python -m uvicorn src.api.app:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./cnaps_urls.json:/app/cnaps_urls.json
      - ./tests:/app/tests
      - ./pytest.ini:/app/pytest.ini
      # - ./registry.json:/app/registry.json
    extra_hosts:
      - "model-runner.docker.internal:host-gateway"
      - "host.docker.internal:host-gateway"
    environment:
      - UVICORN_LOOP=asyncio
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - PYTHONPATH=/app/src
    networks:
      - chat-network
      - admin-network
    depends_on:
      chromadb:
        condition: service_started
      redis-cache:
        condition: service_healthy

  chromadb:
    image: chromadb/chroma:1.5.10.dev28
    container_name: cnaps_chromadb
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/cnaps_data
    networks:
      - chat-network
    environment:
      - CHROMA_CORS_ALLOW_ORIGINS=["http://localhost:3000", "http://localhost:3001", "http://chromadb-admin:3001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v2/heartbeat')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis-cache:
    image: redis/redis-stack:latest
    container_name: redis_cnaps_server
    restart: unless-stopped
    networks:
      - chat-network
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    environment:
      - REDIS_ARGS=--appendonly yes --protected-mode no --bind 0.0.0.0 --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.50'
        reservations:
          memory: 256M
          cpus: '0.25'

  redis-ui:
    container_name: redis-ui
    image: redis/redisinsight:3.4
    restart: unless-stopped
    ports:
      - "5540:5540"
    volumes:
      - redisinsight-data:/data
    networks:
      - chat-network

  chromadb-admin:
    image: fengzhichao/chromadb-admin:latest
    container_name: chromadb-admin
    ports:
      - "3001:3001"
    environment:
      - CHROMA_URL=http://chromadb:8000
      - NEXT_PUBLIC_CHROMA_URL=http://chromadb:8000
      - CHROMA_SERVER_URL=http://chromadb:8000
    networks:
      - chat-network
    depends_on:
      - chromadb

  # ─── Frontend Lucy BOT ────────────────────────────────────────────
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: frontend
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - chat-network
    depends_on:
      - backend

networks:
  chat-network:
    driver: bridge
  admin-network:
    name: admin-network
    driver: bridge

volumes:
  chroma_data:
  redis_data:
    name: redis_cnaps_data
  redisinsight-data:
    name: redis_ui_data
models:
  bge-m3:
    model: gpustack/bge-m3-gguf
    context_size: 8192
