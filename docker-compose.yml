services:
  app:
    container_name: ai-agent-cnaps
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - /vector_cnaps_db:/app/vector_cnaps_db
    extra_hosts:
      - "model-runner.docker.internal:host-gateway"
    depends_on:
      - weaviate          # ← votre app attend que Weaviate soit prêt

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:latest
    ports:
      - "9080:8080"
      - "50051:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: text2vec-transformers
      ENABLE_MODULES: text2vec-transformers,text2vec-ollama,generative-ollama
      TRANSFORMERS_INFERENCE_API: http://text2vec-transformers:8080
      CLUSTER_HOSTNAME: "node1"
      OLLAMA_API_ENDPOINT: 'http://ollama:11434'
    volumes:
      - weaviate_data:/var/lib/weaviate
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  text2vec-transformers:
    # Léger, rapide sur CPU, idéal RAG
    image: cr.weaviate.io/semitechnologies/transformers-inference:sentence-transformers-all-MiniLM-L6-v2-onnx
    environment:
      ENABLE_CUDA: 0

models:
  bge-m3:
    model: gpustack/bge-m3-gguf
    context_size: 8192

volumes:
  weaviate_data:
  ollama_data: